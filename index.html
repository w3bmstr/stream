<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resilient PeerJS Video Stream</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 24px; }
    .container { max-width: 800px; margin: 0 auto; }
    video { width: 100%; max-height: 480px; background: #000; border-radius: 8px; margin-top: 12px; }
    .controls { display: flex; gap: 10px; margin-bottom: 16px; }
    button, input { padding: 10px 14px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #fff; }
    button { cursor: pointer; background: #238636; border: none; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #logPanel { background: #010409; border: 1px solid #30363d; padding: 12px; border-radius: 6px; height: 180px; overflow-y: auto; font-family: monospace; font-size: 13px; margin-top: 16px; }
    .log-state { color: #3fb950; }
    .log-warn { color: #d29922; }
    .log-err { color: #f85149; }
  </style>
</head>
<body>
  <div class="container">
    <h1>PeerJS Resilient WebRTC Stream</h1>
    
    <div class="controls">
      <input type="text" id="peerIdInput" placeholder="Target Broadcaster Peer ID">
      <button id="startBroadcasterBtn">Start Broadcaster</button>
      <button id="startViewerBtn">Connect as Viewer</button>
    </div>
    
    <p>My Peer ID: <strong id="myPeerId">Connecting...</strong></p>

    <video id="remoteVideo" autoplay playsinline controls></video>
    <video id="localVideo" autoplay playsinline muted style="display:none;"></video>

    <div id="logPanel"></div>
  </div>

  <script>
    let peer = null;
    let activeCall = null;
    let localStream = null;
    let watchdogInterval = null;
    let iceFailureTimer = null;
    let isBroadcaster = false;

    const logPanel = document.getElementById('logPanel');
    const myPeerIdEl = document.getElementById('myPeerId');

    function logToPanel(msg, type = '') {
      const div = document.createElement('div');
      if (type) div.className = type;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logPanel.appendChild(div);
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    function initPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', (id) => {
        myPeerIdEl.textContent = id;
        logToPanel(`Peer initialized with ID: ${id}`, 'log-state');
      });

      // Reconnect signaling socket independently without teardown of ongoing media
      peer.on('disconnected', () => {
        logToPanel('Signaling socket idle/disconnected. Reconnecting socket...', 'log-warn');
        peer.reconnect();
      });

      peer.on('error', (err) => {
        logToPanel(`Peer error (${err.type}): ${err.message}`, 'log-err');
      });

      // Handle incoming calls on the broadcaster side
      peer.on('call', (incomingCall) => {
        logToPanel('Incoming call request received...', 'log-state');
        if (isBroadcaster && localStream) {
          activeCall = incomingCall;
          activeCall.answer(localStream);
          setupCallListeners(activeCall);
        }
      });
    }

    function clearWatchdog() {
      if (watchdogInterval) {
        clearInterval(watchdogInterval);
        watchdogInterval = null;
      }
      if (iceFailureTimer) {
        clearTimeout(iceFailureTimer);
        iceFailureTimer = null;
      }
    }

    function watchIceState(call, onBad) {
      clearWatchdog();

      const check = () => {
        const pc = call && call.peerConnection;
        if (!pc) return;

        const iceState = pc.iceConnectionState;
        const connState = pc.connectionState;

        // 1. Connection healthy or recovered
        if (iceState === 'connected' || iceState === 'completed' || connState === 'connected') {
          if (iceFailureTimer) {
            clearTimeout(iceFailureTimer);
            iceFailureTimer = null;
            logToPanel('ICE self-healed back to connected state.', 'log-state');
          }
          return;
        }

        // 2. Hard failure: immediate trigger
        if (iceState === 'failed' || iceState === 'closed') {
          clearWatchdog();
          onBad(iceState);
        } 
        // 3. Transient disconnect: 5-second grace period before failing
        else if (iceState === 'disconnected') {
          if (!iceFailureTimer) {
            logToPanel('ICE disconnected — waiting 5s grace period for auto-recovery...', 'log-warn');
            iceFailureTimer = setTimeout(() => {
              iceFailureTimer = null;
              const currentIce = call && call.peerConnection && call.peerConnection.iceConnectionState;
              if (currentIce === 'disconnected' || currentIce === 'failed') {
                clearWatchdog();
                onBad(currentIce);
              }
            }, 5000);
          }
        }
      };

      watchdogInterval = setInterval(check, 1000);
    }

    function setupCallListeners(call) {
      call.on('stream', (remoteStream) => {
        logToPanel('Media stream connected and rendering.', 'log-state');
        document.getElementById('remoteVideo').srcObject = remoteStream;
      });

      call.on('close', () => {
        logToPanel('Media session closed.', 'log-warn');
        clearWatchdog();
      });

      call.on('error', (err) => {
        logToPanel(`Call error: ${err}`, 'log-err');
      });

      watchIceState(call, (failedState) => {
        logToPanel(`Unrecoverable ICE failure (${failedState}). Closing call...`, 'log-err');
        call.close();
        
        // Only viewer re-initiates connection to prevent glare/race conditions
        if (!isBroadcaster) {
          logToPanel('Viewer initiating reconnection in 3s...', 'log-warn');
          setTimeout(() => {
            const targetId = document.getElementById('peerIdInput').value.trim();
            if (targetId) connectAsViewer(targetId);
          }, 3000);
        }
      });
    }

    async function startBroadcaster() {
      isBroadcaster = true;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        logToPanel('Broadcaster active. Waiting for viewers...', 'log-state');
      } catch (err) {
        logToPanel(`Camera/Microphone error: ${err.message}`, 'log-err');
      }
    }

    function connectAsViewer(targetId) {
      if (!targetId) {
        alert('Enter a valid Peer ID');
        return;
      }
      isBroadcaster = false;
      logToPanel(`Connecting to broadcaster: ${targetId}...`, 'log-state');
      activeCall = peer.call(targetId, new MediaStream());
      setupCallListeners(activeCall);
    }

    document.getElementById('startBroadcasterBtn').addEventListener('click', startBroadcaster);
    document.getElementById('startViewerBtn').addEventListener('click', () => {
      connectAsViewer(document.getElementById('peerIdInput').value.trim());
    });

    initPeer();
  </script>
</body>
</html>
