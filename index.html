<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate-Limit Safe P2P Stream</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" crossorigin="anonymous"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 640px; }
    video { width: 100%; height: 360px; background: #000; border-radius: 8px; object-fit: cover; display: block; }
    button { width: 100%; padding: 12px; margin: 12px 0; border-radius: 6px; border: none; background: #238636; color: #fff; font-weight: 600; cursor: pointer; }
    #status { font-family: monospace; font-size: 13px; color: #3fb950; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Resilient P2P Stream</h2>
    <button id="hostBtn">Start Host Camera</button>
    <video id="videoPlayer" autoplay playsinline muted></video>
    <div id="status">Status: Initializing...</div>
  </div>

  <script>
    const ROOM_ID = 'live-stream-room-channel';
    let peer = null;
    let localStream = null;
    let retryDelay = 3000; // Initial delay: 3 seconds
    const MAX_RETRY_DELAY = 30000; // Max delay: 30 seconds

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function setStatus(msg) { document.getElementById('status').textContent = `Status: ${msg}`; }

    function getDummyStream() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 2;
      const ctx = canvas.getContext('2d');
      ctx.fillRect(0, 0, 2, 2);
      return canvas.captureStream(1);
    }

    function initViewer() {
      if (peer && !peer.destroyed) return;

      peer = new Peer({ config: rtcConfig });

      peer.on('open', () => {
        retryDelay = 3000; // Reset delay on successful connection
        setStatus('Searching for host broadcast...');
        tryConnect();
      });

      peer.on('error', err => {
        if (err.type === 'peer-unavailable') {
          setStatus(`Host offline. Retrying in ${retryDelay / 1000}s...`);
          setTimeout(tryConnect, retryDelay);
          // Exponential backoff: Double delay up to 30s max
          retryDelay = Math.min(retryDelay * 2, MAX_RETRY_DELAY);
        } else if (err.type === 'unavailable-id') {
          setStatus('ID locked. Close extra host tabs and wait 30s.');
        } else {
          setStatus(`Signaling Error (${err.type}). Pausing requests...`);
        }
      });
    }

    function tryConnect() {
      if (!peer || peer.destroyed || peer.disconnected) return;
      
      const dummy = getDummyStream();
      const call = peer.call(ROOM_ID, dummy);

      if (call) {
        call.on('stream', remoteStream => {
          retryDelay = 3000;
          setStatus('Live Stream Connected!');
          const video = document.getElementById('videoPlayer');
          video.srcObject = remoteStream;
          video.play().catch(() => setStatus('Stream ready. Tap screen to play.'));
        });
      }
    }

    document.getElementById('hostBtn').addEventListener('click', async () => {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('videoPlayer').srcObject = localStream;

        if (peer) {
          peer.destroy();
          peer = null;
        }

        peer = new Peer(ROOM_ID, { config: rtcConfig });

        peer.on('open', () => setStatus('Broadcasting live. Viewers auto-connect now.'));

        peer.on('call', call => {
          setStatus('Viewer connected.');
          call.answer(localStream);
        });

      } catch (err) {
        setStatus(`Camera Error: ${err.message}`);
      }
    });

    initViewer();
  </script>
</body>
</html>
