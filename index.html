<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Camera Stream</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.8rem; }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.2rem;
      width: 100%;
      max-width: 520px;
      margin-bottom: 1rem;
    }
    label { display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #94a3b8; }
    select, input {
      width: 100%;
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 1rem;
      margin-bottom: 0.8rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 0.5rem;
    }
    button.secondary { background: #475569; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    video {
      width: 100%;
      max-width: 520px;
      background: #000;
      border-radius: 12px;
      aspect-ratio: 16/9;
      margin-top: 0.8rem;
    }
    #status {
      margin-top: 0.8rem;
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
      min-height: 1.4em;
    }
    .error { color: #f87171; }
    .success { color: #4ade80; }
    .hint { font-size: 0.85rem; color: #64748b; margin-top: 0.6rem; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Live Camera Stream</h1>

  <div class="card">
    <label>Mode</label>
    <select id="mode">
      <option value="broadcast">Broadcast (Android phone)</option>
      <option value="watch">Watch (anyone)</option>
    </select>

    <label>Stream ID (choose any simple name)</label>
    <input id="streamId" type="text" placeholder="e.g. mycam or room1" value="mycam" />

    <button id="startBtn">Start</button>
    <button id="stopBtn" class="secondary" disabled>Stop</button>

    <div class="hint">
      <strong>Broadcast:</strong> Open this page on your phone → choose Broadcast → Start.<br>
      <strong>Watch:</strong> Open the same page on any device → choose Watch → enter the same Stream ID → Start.
    </div>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <div id="status">Ready</div>

  <script>
    const modeSelect = document.getElementById('mode');
    const streamIdInput = document.getElementById('streamId');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');

    let peer = null;
    let localStream = null;
    let currentCall = null;

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = type;
    }

    function cleanup() {
      if (currentCall) {
        currentCall.close();
        currentCall = null;
      }
      if (peer) {
        peer.destroy();
        peer = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      video.srcObject = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    async function startBroadcast(id) {
      try {
        setStatus('Starting camera…');
        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = localStream;
        video.muted = true;

        peer = new Peer(id, {
          debug: 1,
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'stun:stun1.l.google.com:19302' }
            ]
          }
        });

        peer.on('open', (myId) => {
          setStatus(`Broadcasting as "${myId}" – anyone can watch with this ID`, 'success');
          startBtn.disabled = true;
          stopBtn.disabled = false;
        });

        peer.on('call', (call) => {
          setStatus('Viewer connected!', 'success');
          call.answer(localStream);          // send our camera to the viewer
          currentCall = call;

          call.on('close', () => {
            setStatus('Viewer disconnected');
          });
        });

        peer.on('error', (err) => {
          console.error(err);
          setStatus('Error: ' + err.type, 'error');
          if (err.type === 'unavailable-id') {
            setStatus('That Stream ID is already in use. Pick another one.', 'error');
          }
        });

      } catch (err) {
        console.error(err);
        setStatus('Camera error: ' + err.message, 'error');
        cleanup();
      }
    }

    function startWatch(id) {
      setStatus('Connecting…');

      peer = new Peer({
        debug: 1,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      peer.on('open', () => {
        const call = peer.call(id, null);   // call the broadcaster (no local media needed)
        if (!call) {
          setStatus('Could not start call', 'error');
          return;
        }
        currentCall = call;

        call.on('stream', (remoteStream) => {
          video.srcObject = remoteStream;
          video.muted = false;
          setStatus('Connected – watching live', 'success');
          startBtn.disabled = true;
          stopBtn.disabled = false;
        });

        call.on('close', () => {
          setStatus('Stream ended');
          cleanup();
        });

        call.on('error', (err) => {
          setStatus('Call error: ' + err, 'error');
        });
      });

      peer.on('error', (err) => {
        console.error(err);
        setStatus('Error: ' + err.type + (err.type === 'peer-unavailable' ? ' – is the phone broadcasting?' : ''), 'error');
      });
    }

    startBtn.onclick = () => {
      const id = streamIdInput.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
      if (!id) {
        setStatus('Please enter a Stream ID', 'error');
        return;
      }
      streamIdInput.value = id;

      cleanup();

      if (modeSelect.value === 'broadcast') {
        startBroadcast(id);
      } else {
        startWatch(id);
      }
    };

    stopBtn.onclick = () => {
      cleanup();
      setStatus('Stopped');
    };

    // Clean up when leaving the page
    window.addEventListener('beforeunload', cleanup);
  </script>
</body>
</html>
