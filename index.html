<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Live Camera Stream</title>
  <script src="peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.8rem; }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 1.2rem;
      width: 100%;
      max-width: 520px;
      margin-bottom: 1rem;
    }
    label { display: block; margin-bottom: 0.3rem; font-size: 0.9rem; color: #94a3b8; }
    select, input {
      width: 100%;
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 1rem;
      margin-bottom: 0.8rem;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 0.5rem;
    }
    button.secondary { background: #475569; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    video {
      width: 100%;
      max-width: 520px;
      background: #000;
      border-radius: 12px;
      aspect-ratio: 16/9;
      margin-top: 0.8rem;
    }
    #status {
      margin-top: 0.8rem;
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
      min-height: 1.4em;
    }
    .error { color: #f87171; }
    .success { color: #4ade80; }
    .hint { font-size: 0.85rem; color: #64748b; margin-top: 0.6rem; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Live Camera Stream</h1>

  <div class="card">
    <label>Mode</label>
    <select id="mode">
      <option value="broadcast">Broadcast (Android phone)</option>
      <option value="watch">Watch (anyone)</option>
    </select>

    <label>Stream ID</label>
    <input id="streamId" type="text" value="mycam" placeholder="e.g. mycam" />

    <button id="startBtn">Start</button>
    <button id="stopBtn" class="secondary" disabled>Stop</button>

    <div class="hint">
      <b>Phone:</b> Broadcast → Start<br>
      <b>Other device:</b> Watch → type the exact same Stream ID → Start<br>
      If you get “ID is taken”, change the Stream ID (e.g. mycam2) and try again.
    </div>
  </div>

  <video id="video" autoplay playsinline muted></video>
  <div id="status">Ready</div>

  <script>
    const modeSelect = document.getElementById('mode');
    const streamIdInput = document.getElementById('streamId');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');

    let peer = null;
    let localStream = null;
    let currentCall = null;
    let dataConn = null;
    let currentMode = null;
    let currentId = null;
    let retryTimeout = null;
    let watchdogInterval = null;
    let manualStop = false;

    const ICE_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        // Public TURN relay fallback — needed when STUN alone can't punch through
        // strict NATs/firewalls (common on desktop/corporate networks).
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        },
        {
          urls: 'turn:openrelay.metered.ca:443?transport=tcp',
          username: 'openrelayproject',
          credential: 'openrelayproject'
        }
      ]
    };

    function clearWatchdog() {
      if (watchdogInterval) {
        clearInterval(watchdogInterval);
        watchdogInterval = null;
      }
    }

    function watchIceState(call, onBad) {
      clearWatchdog();
      watchdogInterval = setInterval(() => {
        const pc = call && call.peerConnection;
        if (!pc) return;
        const state = pc.iceConnectionState;
        if (state === 'disconnected' || state === 'failed' || state === 'closed') {
          clearWatchdog();
          onBad(state);
        }
      }, 2000);
    }

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className = type;
    }

    function cleanup() {
      clearWatchdog();
      if (retryTimeout) { clearTimeout(retryTimeout); retryTimeout = null; }
      try {
        if (currentCall) { currentCall.close(); currentCall = null; }
        if (dataConn) { dataConn.close(); dataConn = null; }
        if (peer) { peer.destroy(); peer = null; }
        if (localStream) {
          localStream.getTracks().forEach(t => t.stop());
          localStream = null;
        }
      } catch (e) {}
      video.srcObject = null;
      startBtn.disabled = false;
      stopBtn.disabled = true;
    }

    // ========== BROADCAST (phone) ==========
    async function startBroadcast(id) {
      try {
        setStatus('Starting camera…');

        localStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = localStream;
        video.muted = true;

        currentMode = 'broadcast';
        currentId = id;
        manualStop = false;

        // Create the peer
        peer = new Peer(id, {
          debug: 1,
          config: ICE_CONFIG
        });

        peer.on('open', (myId) => {
          setStatus(`Broadcasting as "${myId}"`, 'success');
          startBtn.disabled = true;
          stopBtn.disabled = false;
        });

        peer.on('connection', (conn) => {
          dataConn = conn;
          conn.on('data', (viewerId) => {
            setStatus('Viewer joined – sending camera…', 'success');
            currentCall = peer.call(viewerId, localStream);
            currentCall.on('close', () => setStatus('Viewer left'));

            // Watch the connection and re-send the stream if it dies
            // without the page knowing (common on flaky NATs).
            watchIceState(currentCall, (state) => {
              setStatus(`Connection ${state}, waiting for viewer to reconnect…`, 'error');
            });
          });
        });

        peer.on('disconnected', () => {
          if (manualStop) return;
          setStatus('Lost connection to signaling server, reconnecting…', 'error');
          try { peer.reconnect(); } catch (e) {}
        });

        peer.on('error', (err) => {
          console.error(err);
          if (err.type === 'unavailable-id') {
            // The old session's ID is likely still held by the server from
            // an unclean disconnect. Destroy this peer and retry shortly
            // instead of giving up immediately.
            setStatus('ID busy (stale session?) — retrying…', 'error');
            if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
            if (!manualStop) {
              retryTimeout = setTimeout(() => {
                if (!manualStop && currentMode === 'broadcast') startBroadcast(id);
              }, 3000);
            }
          } else if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error' || err.type === 'socket-closed') {
            setStatus('Connection problem — retrying…', 'error');
            if (!manualStop) {
              retryTimeout = setTimeout(() => {
                if (!manualStop && currentMode === 'broadcast') startBroadcast(id);
              }, 3000);
            }
          } else {
            setStatus('Error: ' + err.type, 'error');
            cleanup();
          }
        });

      } catch (err) {
        console.error(err);
        setStatus('Camera error: ' + err.message, 'error');
        cleanup();
      }
    }

    // ========== WATCH ==========
    function startWatch(id) {
      setStatus('Connecting…');
      currentMode = 'watch';
      currentId = id;
      manualStop = false;

      peer = new Peer({
        debug: 1,
        config: ICE_CONFIG
      });

      peer.on('open', (myId) => {
        dataConn = peer.connect(id);

        dataConn.on('open', () => {
          dataConn.send(myId); // tell the phone our ID
          setStatus('Waiting for stream…');
        });

        dataConn.on('error', () => {
          setStatus('Could not reach broadcaster', 'error');
        });
      });

      peer.on('call', (call) => {
        currentCall = call;
        call.answer(); // receive only

        call.on('stream', (remoteStream) => {
          video.srcObject = remoteStream;
          video.muted = false;
          setStatus('Connected – watching live', 'success');
          startBtn.disabled = true;
          stopBtn.disabled = false;

          // Watch the connection so a silent NAT/ICE failure doesn't just
          // freeze the last video frame forever.
          watchIceState(call, (state) => {
            setStatus(`Connection ${state} — reconnecting…`, 'error');
            if (!manualStop) {
              retryTimeout = setTimeout(() => {
                if (!manualStop && currentMode === 'watch') {
                  cleanup();
                  startWatch(id);
                }
              }, 1500);
            }
          });
        });

        call.on('close', () => {
          setStatus('Stream ended');
          cleanup();
        });
      });

      peer.on('disconnected', () => {
        if (manualStop) return;
        setStatus('Lost connection to signaling server, reconnecting…', 'error');
        try { peer.reconnect(); } catch (e) {}
      });

      peer.on('error', (err) => {
        console.error(err);
        if (err.type === 'peer-unavailable') {
          setStatus('Stream not found. Is the phone broadcasting?', 'error');
        } else if (err.type === 'network' || err.type === 'server-error' || err.type === 'socket-error' || err.type === 'socket-closed') {
          setStatus('Connection problem — retrying…', 'error');
          if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
          if (!manualStop) {
            retryTimeout = setTimeout(() => {
              if (!manualStop && currentMode === 'watch') startWatch(id);
            }, 3000);
          }
        } else {
          setStatus('Error: ' + err.type, 'error');
        }
      });
    }

    // ========== BUTTONS ==========
    startBtn.onclick = () => {
      const id = streamIdInput.value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '');
      if (!id) {
        setStatus('Please enter a Stream ID', 'error');
        return;
      }
      streamIdInput.value = id;

      manualStop = true; // cancel any pending retry from a previous session
      cleanup(); // clean previous session

      if (modeSelect.value === 'broadcast') {
        startBroadcast(id);
      } else {
        startWatch(id);
      }
    };

    stopBtn.onclick = () => {
      manualStop = true;
      currentMode = null;
      cleanup();
      setStatus('Stopped');
    };

    window.addEventListener('beforeunload', cleanup);
  </script>
</body>
</html>
