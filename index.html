<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unbreakable P2P Stream</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" crossorigin="anonymous"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 640px; }
    video { width: 100%; height: 360px; background: #000; border-radius: 8px; object-fit: cover; }
    button { width: 100%; padding: 12px; margin: 12px 0; border-radius: 6px; border: none; background: #238636; color: #fff; font-weight: 600; cursor: pointer; }
    #status { font-family: monospace; font-size: 13px; color: #3fb950; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Unbreakable Stream</h2>
    <button id="hostBtn">Start Host Camera</button>
    <video id="videoPlayer" autoplay playsinline muted></video>
    <div id="status">Status: Initializing...</div>
  </div>

  <script>
    const ROOM_ID = 'live-stream-room-channel';
    let peer = null;
    let localStream = null;
    let keepAliveTimer = null;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
        /* 
          For 5G/LTE cross-network support, replace with free personal TURN keys (e.g. Metered.ca):
          { urls: "turn:YOUR_RELAY_URL:443", username: "YOUR_USER", credential: "YOUR_PASSWORD" }
        */
      ]
    };

    // 1. Keep-Alive Ping: Prevents 20-second mobile NAT timeout
    function startKeepAlive(dataChannel) {
      if (keepAliveTimer) clearInterval(keepAliveTimer);
      keepAliveTimer = setInterval(() => {
        if (dataChannel && dataChannel.open) {
          dataChannel.send('ping');
        }
      }, 2000);
    }

    // 2. Native ICE Self-Healing
    function setupICEHealing(pc) {
      if (!pc) return;
      pc.oniceconnectionstatechange = () => {
        document.getElementById('status').textContent = `ICE State: ${pc.iceConnectionState}`;
        if (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed') {
          if (typeof pc.restartIce === 'function') pc.restartIce();
        }
      };
    }

    // Viewer Initialization
    function initViewer() {
      peer = new Peer({ config: rtcConfig });
      peer.on('open', () => {
        document.getElementById('status').textContent = 'Connecting to host...';
        connect();
      });
      peer.on('disconnected', () => peer.reconnect());
    }

    function connect() {
      // Create empty MediaStream container for receive-only setup
      const call = peer.call(ROOM_ID, new MediaStream());
      
      // DataChannel connection strictly for packet heartbeat
      const conn = peer.connect(ROOM_ID);
      conn.on('open', () => startKeepAlive(conn));

      if (call) {
        call.on('stream', remoteStream => {
          document.getElementById('status').textContent = 'Stream Active';
          const video = document.getElementById('videoPlayer');
          video.srcObject = remoteStream;
          video.play().catch(() => {});
        });

        call.on('peerConnection', pc => setupICEHealing(pc));
        call.on('close', () => setTimeout(connect, 3000));
      }
    }

    // Host Initialization
    document.getElementById('hostBtn').addEventListener('click', async () => {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('videoPlayer').srcObject = localStream;

        if (peer) peer.destroy();
        peer = new Peer(ROOM_ID, { config: rtcConfig });

        peer.on('open', () => {
          document.getElementById('status').textContent = 'Broadcasting live.';
        });

        peer.on('call', call => {
          call.answer(localStream);
          setupICEHealing(call.peerConnection);
        });

        peer.on('connection', conn => {
          conn.on('data', () => {}); // Handle incoming keep-alive pings
        });

      } catch (err) {
        document.getElementById('status').textContent = `Error: ${err.message}`;
      }
    });

    initViewer();
  </script>
</body>
</html>
