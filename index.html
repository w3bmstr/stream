<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto-Connect Live Stream</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎥</text></svg>">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" crossorigin="anonymous"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 640px; }
    video { width: 100%; height: 360px; background: #000; border-radius: 8px; object-fit: cover; display: block; }
    .controls { display: flex; gap: 8px; margin: 12px 0; }
    button { flex: 1; padding: 12px; border-radius: 6px; border: none; background: #238636; color: #fff; font-weight: 600; cursor: pointer; font-size: 15px; }
    #status { font-family: monospace; font-size: 13px; color: #3fb950; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Auto-Connect Stream</h2>
    
    <div class="controls">
      <button id="hostBtn">Start Broadcasting (Host)</button>
    </div>

    <video id="videoPlayer" autoplay playsinline muted></video>
    <div id="status">Status: Searching for stream...</div>
  </div>

  <script>
    // Fixed channel ID so any viewer joining the page connects automatically
    const STREAM_ROOM_ID = 'live-stream-room-channel';
    let peer = null;
    let localStream = null;
    let reconnectTimer = null;
    let activeCall = null;

    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('videoPlayer');

    function setStatus(msg) { statusEl.textContent = `Status: ${msg}`; }

    // Generates active dummy stream for PeerJS handshake initialization
    function createDummyStream() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 10;
      const ctx = canvas.getContext('2d');
      setInterval(() => {
        ctx.fillStyle = ctx.fillStyle === '#000000' ? '#ffffff' : '#000000';
        ctx.fillRect(0, 0, 10, 10);
      }, 100);
      return canvas.captureStream(10);
    }

    // Default Viewer Mode: Runs automatically on page load
    function initViewer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
            { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
          ]
        }
      });

      peer.on('open', () => {
        setStatus('Searching for active stream...');
        connectToHost();
      });

      peer.on('disconnected', () => peer.reconnect());
      
      peer.on('error', err => {
        if (err.type === 'peer-unavailable') {
          setStatus('Host offline. Retrying connection in 3s...');
          scheduleReconnect();
        }
      });
    }

    function connectToHost() {
      if (reconnectTimer) clearTimeout(reconnectTimer);

      const dummyStream = createDummyStream();
      activeCall = peer.call(STREAM_ROOM_ID, dummyStream);

      if (!activeCall) {
        scheduleReconnect();
        return;
      }

      activeCall.on('stream', remoteStream => {
        setStatus('Live Stream Connected');
        videoEl.srcObject = remoteStream;
        videoEl.play().catch(() => setStatus('Tap screen to play video'));
      });

      activeCall.on('close', () => {
        setStatus('Stream connection closed. Rejoining...');
        scheduleReconnect();
      });

      activeCall.on('error', () => scheduleReconnect());

      // Auto-reconnect instantly if cellular network blips
      if (activeCall.peerConnection) {
        activeCall.peerConnection.oniceconnectionstatechange = () => {
          const state = activeCall.peerConnection.iceConnectionState;
          if (state === 'failed' || state === 'disconnected') {
            setStatus('Network drop detected. Re-establishing stream...');
            activeCall.close();
            scheduleReconnect();
          }
        };
      }
    }

    function scheduleReconnect() {
      if (reconnectTimer) clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => connectToHost(), 3000);
    }

    // Host Mode Setup
    document.getElementById('hostBtn').addEventListener('click', async () => {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        videoEl.srcObject = localStream;

        // Destroy viewer instance and re-register under fixed STREAM_ROOM_ID
        if (peer) peer.destroy();

        peer = new Peer(STREAM_ROOM_ID, {
          config: {
            iceServers: [
              { urls: 'stun:stun.l.google.com:19302' },
              { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
              { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
            ]
          }
        });

        peer.on('open', () => {
          setStatus('Broadcasting! Viewers will auto-connect upon opening the page.');
        });

        peer.on('call', call => {
          setStatus('Viewer connected.');
          call.answer(localStream);
        });

        peer.on('error', err => {
          if (err.type === 'unavailable-id') {
            setStatus('Broadcaster is already running on another device.');
          }
        });

      } catch (err) {
        setStatus(`Camera error: ${err.message}`);
      }
    });

    // Automatically initialize as viewer on load
    initViewer();
  </script>
</body>
</html>
