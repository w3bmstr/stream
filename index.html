<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom WebRTC Stream</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; margin: 0; padding: 16px; }
    .container { max-width: 600px; margin: 0 auto; }
    video { width: 100%; height: 300px; background: #000; border-radius: 8px; object-fit: cover; }
    .controls { display: flex; gap: 8px; margin: 12px 0; }
    input, button { padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #fff; }
    input { flex: 1; }
    button { cursor: pointer; background: #238636; border: none; font-weight: 600; }
    #status { font-family: monospace; font-size: 13px; color: #3fb950; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Native WebRTC P2P Stream</h2>
    
    <div class="controls">
      <input type="text" id="targetId" placeholder="Host Peer ID">
      <button id="hostBtn">Start Host</button>
      <button id="joinBtn">Join Stream</button>
    </div>

    <p>Your ID: <strong id="myId">Initializing...</strong></p>
    <video id="videoPlayer" autoplay playsinline muted></video>
    <div id="status">Status: Idle</div>
  </div>

  <script>
    let peer = null;
    let localStream = null;
    const statusEl = document.getElementById('status');
    const videoEl = document.getElementById('videoPlayer');

    function setStatus(msg) { statusEl.textContent = `Status: ${msg}`; }

    // Generates a lightweight animated stream required by PeerJS constructor
    function createDummyStream() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 10;
      const ctx = canvas.getContext('2d');
      setInterval(() => {
        ctx.fillStyle = ctx.fillStyle === '#000000' ? '#ffffff' : '#000000';
        ctx.fillRect(0, 0, 10, 10);
      }, 100);
      return canvas.captureStream(10);
    }

    function initPeer() {
      peer = new Peer({
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
            { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' },
            { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelay', credential: 'openrelay' }
          ]
        }
      });

      peer.on('open', id => {
        document.getElementById('myId').textContent = id;
        setStatus('Ready to connect');
      });

      peer.on('disconnected', () => peer.reconnect());

      peer.on('call', call => {
        setStatus('Viewer connected');
        call.answer(localStream);
        setTimeout(() => bindIceAutoHealing(call.peerConnection), 500);
      });
    }

    function bindIceAutoHealing(pc) {
      if (!pc) return;
      pc.oniceconnectionstatechange = () => {
        setStatus(`ICE State: ${pc.iceConnectionState}`);
        if (pc.iceConnectionState === 'disconnected') {
          setStatus('Network blip detected. Self-healing connection...');
          if (typeof pc.restartIce === 'function') pc.restartIce();
        }
      };
    }

    // Host Mode
    document.getElementById('hostBtn').addEventListener('click', async () => {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        videoEl.srcObject = localStream;
        setStatus('Broadcasting active camera feed...');
      } catch (err) {
        setStatus(`Camera error: ${err.message}`);
      }
    });

    // Viewer Mode
    document.getElementById('joinBtn').addEventListener('click', () => {
      const hostId = document.getElementById('targetId').value.trim();
      if (!hostId) return alert('Enter Host ID');

      // 1. Guard against calling before PeerJS signaling is ready
      if (!peer || !peer.open) {
        return setStatus('Peer connection not ready yet. Wait a moment and try again.');
      }

      setStatus(`Connecting to host: ${hostId}...`);
      
      // 2. Pass dummy stream to prevent PeerJS from returning undefined
      const dummyStream = createDummyStream();
      const call = peer.call(hostId, dummyStream);

      if (!call) {
        return setStatus('Failed to initiate call connection.');
      }

      call.on('stream', remoteStream => {
        setStatus('Stream connected and rendering');
        videoEl.srcObject = remoteStream;
        videoEl.play().catch(() => setStatus('Tap screen to play video'));
      });

      setTimeout(() => bindIceAutoHealing(call.peerConnection), 500);
    });

    initPeer();
  </script>
</body>
</html>
